name: Coverage
permissions:
  contents: write
on:
  push:
    branches:
      - 'main'
      - 'preview'
    paths-ignore:
      - '.badges/chore_workflows/coverage.svg'
  pull_request:
    # '**' rather than '*': a single star does not match a slash, so a base branch
    # like fix/modernization-phase-2 selects no workflow at all. Every pull request
    # gets the gate regardless of what it targets.
    branches:
      - '**'
    paths-ignore:
      - '.badges/chore_workflows/coverage.svg'

jobs:
  Coverage:
    # Single job with every SDK installed: the solution multi-targets net9.0, net10.0
    # and net11.0, so a per-SDK matrix cannot build it — and two parallel jobs racing
    # to push the badge branch caused non-fast-forward failures.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # Separate step for net11.0: `dotnet-quality: preview` applies to every version in
      # its step's list, so folding 11.0.x into the list above would pull pre-release
      # patches of the shipping TFMs too. Merge it in once .NET 11 reaches GA.
      - name: Setup .NET 11 Preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Install Coverlet global tool
        run: dotnet tool install --global coverlet.console

      - name: Restore dependencies
        run: dotnet restore Stella.Ergosfare.slnx

      # Category!=E2E: the end-to-end test spends its time in a `dotnet build` of a fixture
      # outside this solution, so it instruments nothing here while being the slowest test
      # in the suite. It is gated in the UnitTests workflow instead.
      - name: Run Unit & Coverage Tests
        shell: bash
        run: |
          dotnet test Stella.Ergosfare.slnx --settings coverlet.runsettings /p:CoverletOutput=./.coverage/coverage.cobertura.xml /p:MergeWith="" --logger "trx;LogFilePrefix=Coverage" --filter "Category!=E2E"

      - name: Install Report Generator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Merge coverage reports
        shell: bash
        run: reportgenerator -reports:./**/coverage.cobertura.xml -targetdir:./.coverage -reporttypes:Cobertura

      - name: Require at least 90% line coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          coverage = ET.parse(".coverage/Cobertura.xml").getroot()
          covered = int(coverage.attrib["lines-covered"])
          total = int(coverage.attrib["lines-valid"])
          if total <= 0:
              raise SystemExit("Coverage report contains no executable lines.")
          print(f"Total line coverage: {covered / total:.2%} ({covered}/{total})")
          if covered * 100 < total * 90:
              raise SystemExit("Line coverage must be at least 90%.")
          PY

      # The badge reflects main's coverage: only publish it from pushes to main.
      # Publishing from pull requests both raced the branch ref and overwrote the
      # badge with PR coverage.
      - uses: action-badges/create-orphan-branch@0.1.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          branch-name: badges

      # 0.5.0 is the node24-native build; 0.3.1's node20 bundle crashed once GitHub
      # started forcing Node 24. The file-name/badge-branch/github-token inputs are
      # consumed by the action even though its action.yml does not declare them — the
      # runner's "unexpected input" warning is cosmetic, but omitting github-token
      # makes the badge upload crash.
      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: action-badges/cobertura-coverage-xml-badges@0.5.0
        with:
          coverage-file-name: ./.coverage/Cobertura.xml
          file-name: coverage.svg
          badge-branch: badges
          github-token: ${{ secrets.GITHUB_TOKEN }}
