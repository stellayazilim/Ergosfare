name: UnitTests
permissions:
  contents: read
on:
  push:
    branches:
      - "*"
  pull_request:
    # "**" rather than "*": a single star does not match a slash, so a base branch
    # like fix/modernization-phase-2 selects no workflow at all. Every pull request
    # gets the gate regardless of what it targets.
    branches:
      - "**"

jobs:
  unit-tests:
    # Single job with every SDK installed: the solution multi-targets net9.0, net10.0
    # and net11.0, so a per-SDK matrix cannot restore/build it with only one SDK.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # Separate step for net11.0: `dotnet-quality: preview` applies to every version in
      # its step's list, so folding 11.0.x into the list above would pull pre-release
      # patches of the shipping TFMs too. Drop this step and merge the version in once
      # .NET 11 reaches GA (November 2026).
      - name: Setup .NET 11 Preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore Dependencies
        run: dotnet restore Stella.Ergosfare.slnx

      # Category=Contract is the core-modernization safety net
      # (test/Stella.Ergosfare.Contract.Test): it runs both registration axes on every
      # TFM and is named here explicitly so it can never fall out of CI unnoticed.
      # With net11.0 in the matrix this is also what proves .NET 11 keeps the lane map.
      - name: Run Unit Tests
        run: |
          dotnet test Stella.Ergosfare.slnx \
            --logger "trx;LogFileName=unit-tests.trx" \
            --filter "Category=Unit|Category=Contract"

      # Category=E2E drives a real `dotnet build` of a fixture that is meant not to
      # compile — the analyzer travelling as an analyzer, the package's props, and K5's
      # composition-root gate. The filter above leaves it out, so it gets its own step
      # rather than going unrun; the fixture lives outside the solution precisely so a
      # solution build never picks it up.
      - name: Run End-to-End Tests
        run: |
          dotnet test test/Stella.Ergosfare.SourceGenerator.Test \
            --logger "trx;LogFileName=e2e-tests.trx" \
            --filter "Category=E2E"
